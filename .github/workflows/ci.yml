name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

# Least-privilege by default. Jobs opt into more only if they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Repo hygiene & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Required docs present
        run: |
          test -f CLAUDE.md || { echo "::error::CLAUDE.md is missing"; exit 1; }
          test -f README.md || { echo "::error::README.md is missing"; exit 1; }
          test -f CHANGELOG.md || { echo "::error::CHANGELOG.md is missing"; exit 1; }

      - name: CLAUDE.md is non-trivial (kept up to date)
        run: |
          lines=$(wc -l < CLAUDE.md)
          echo "CLAUDE.md has $lines lines"
          if [ "$lines" -lt 40 ]; then
            echo "::error::CLAUDE.md looks too short — keep it current with the code."
            exit 1
          fi
          grep -qi "changelog" CLAUDE.md || {
            echo "::error::CLAUDE.md must keep a Changelog section."; exit 1; }

      - name: Block committed secrets / private config
        run: |
          if git ls-files | grep -E '(^|/)(local\.properties|.*\.jks|.*\.keystore|.*\.p12|.*\.pem|google-services\.json|.*\.env)$'; then
            echo "::error::A secret/config file must not be committed."
            exit 1
          fi

      - name: Secret pattern scan
        run: |
          # High-confidence secret patterns only. Public reverse-engineered app
          # constants (client_id/secret/stamp cfb) live in RegionConfig and are NOT user secrets.
          if grep -RInE '(-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ghp_[0-9A-Za-z]{36}|gho_[0-9A-Za-z]{36}|xox[baprs]-[0-9A-Za-z-]+|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' \
             --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle . ; then
            echo "::error::Potential hard-coded secret detected."
            exit 1
          fi
          echo "No secrets detected."

      - name: gitleaks (best-effort deep scan)
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Build · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lint

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
